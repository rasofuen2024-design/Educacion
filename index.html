<!DOCTYPE html>
<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Didáctico - I.E. Santa Rosa | Comprensión Lectora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

<body>
    <!-- BOTÓN DE AJUSTES FIJO - ESQUINA SUPERIOR DERECHA -->
    <button class="btn-settings" onclick="openSettings()" title="⚙️ Ajustes">⚙️</button>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="mainContent"></div>

    <!-- MODAL DE AJUSTES -->
    <div id="settingsModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <div class="title-area">
                    <span>⚙️</span>
                    <div>
                        <h2>Ajustes</h2>
                        <p class="subtitle">Panel de configuración</p>
                    </div>
                </div>
                <button class="modal-close" onclick="closeSettings()">✕</button>
            </div>
            <div class="modal-body" id="settingsBody"></div>
        </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
        // Estado de la aplicación
        let state = {
            isAuthenticated: true,
            activeMission: null,
            completedMissions: [],
            totalXP: 0,
            settingsVerified: false,
            activeTab: 'content',
            embedMode: 'url',
            missionData: {}
        };

        const CORRECT_PASSWORD = 'SANTAROSA2026';

        const missions = [
            { id: 1, title: "Miremos, pensemos y comprendamos", description: "Explora textos e imágenes para desarrollar tu capacidad de observación y comprensión.", icon: "👁️", color: "linear-gradient(to right, #a855f7, #4f46e5)", bg: "linear-gradient(to bottom right, #f3e8ff, #e0e7ff)" },
            { id: 2, title: "Viaje interactivo por la lectura", description: "Embárcate en un viaje interactivo donde la lectura cobra vida con tecnología.", icon: "🚀", color: "linear-gradient(to right, #3b82f6, #06b6d4)", bg: "linear-gradient(to bottom right, #dbeafe, #cffafe)" },
            { id: 3, title: "Reto lector: ¡Atrévete a responder!", description: "Pon a prueba tu comprensión lectora con desafíos interactivos y preguntas dinámicas.", icon: "🏆", color: "linear-gradient(to right, #f97316, #ef4444)", bg: "linear-gradient(to bottom right, #ffedd5, #fee2e2)" },
            { id: 4, title: "Palabras que construyen significado", description: "Descubre cómo las palabras se conectan para crear significados profundos en español e inglés.", icon: "📚", color: "linear-gradient(to right, #22c55e, #10b981)", bg: "linear-gradient(to bottom right, #dcfce7, #d1fae5)" },
            { id: 5, title: "Creamos para demostrar lo que comprendimos", description: "Demuestra todo lo aprendido creando tu propio contenido digital interactivo.", icon: "🎨", color: "linear-gradient(to right, #ec4899, #f43f5e)", bg: "linear-gradient(to bottom right, #fce7f3, #ffe4e6)" }
        ];

        function getLevel() {
            const count = state.completedMissions.length;
            if (count === 0) return { name: "Explorador", icon: "🌱" };
            if (count <= 2) return { name: "Aprendiz", icon: "📖" };
            if (count <= 4) return { name: "Lector Avanzado", icon: "⭐" };
            return { name: "Maestro Lector", icon: "👑" };
        }

        function render() {
            const main = document.getElementById('mainContent');
            if (!state.isAuthenticated) { main.innerHTML = renderLoginScreen(); return; }
            if (state.activeMission !== null) { main.innerHTML = renderMissionPage(); return; }
            main.innerHTML = renderMainScreen();
        }

        function renderLoginScreen() {
            return `<div class="login-screen"><div class="login-box"><div class="lock-icon">🔒</div><h2>Sesión Cerrada</h2><p>Has cerrado sesión exitosamente</p><button class="btn-login" onclick="login()">Iniciar Sesión</button></div></div>`;
        }

        function renderMainScreen() {
            const level = getLevel();
            return `
                <header class="header">
                    <div class="header-content">
                        <div class="school-info">
                            <div class="school-logo">🏫</div>
                            <div class="school-name"><h1>I.E. Santa Rosa</h1><p>Módulo de Comprensión Lectora</p></div>
                        </div>
                        <div class="stats">
                            <div class="stat-box"><span style="font-size:20px">${level.icon}</span><div><p class="label">Nivel</p><p class="value yellow">${level.name}</p></div></div>
                            <div class="stat-box"><span style="font-size:20px">⚡</span><div><p class="label">XP</p><p class="value cyan">${state.totalXP}</p></div></div>
                            <div class="stat-box"><span style="font-size:20px">🎯</span><div><p class="label">Misiones</p><p class="value green">${state.completedMissions.length}/5</p></div></div>
                        </div>
                    </div>
                </header>
                <div class="container section">
                    <div class="card"><div class="objective-card"><div class="icon">🎯</div><div><h2>Objetivo del Módulo</h2><p>Fortalecer la comprensión lectora en español e inglés mediante el diseño e implementación de estrategias didácticas digitales interactivas apoyadas en Edpuzzle y otras herramientas tecnológicas, con el fin de favorecer la interpretación, la ampliación del vocabulario y la evaluación formativa de los estudiantes.</p></div></div></div>
                </div>
                <div class="container section">
                    <div class="card badges-section">
                        <h3><span style="font-size:24px">🏅</span> Insignias Ganadas</h3>
                        <div class="badges-grid">
                            ${missions.map(m => { const earned = state.completedMissions.includes(m.id); return `<div class="badge-item ${earned?'':'locked'}"><div class="badge-circle ${earned?'earned':'locked'}" style="${earned?'background:'+m.color:''}">${earned?m.icon:'🔒'}</div><span class="badge-label">${m.title.split(' ').slice(0,3).join(' ')}</span>${earned?'<span class="badge-xp">+200 XP</span>':''}</div>`; }).join('')}
                        </div>
                    </div>
                </div>
                <div class="container section">
                    <h2 class="missions-title"><span style="font-size:28px">🗺️</span> Mapa de Misiones</h2>
                    <div class="missions-grid">
                        ${missions.map((m,i) => { const completed = state.completedMissions.includes(m.id); return `<div class="mission-card ${completed?'completed':''}" style="background:${m.bg}">${completed?'<div class="check-mark">✓</div>':''}<div class="mission-icon" style="animation-delay:${i*0.3}s">${m.icon}</div><h3>Misión ${m.id}</h3><h4>${m.title}</h4><p>${m.description}</p><button class="btn-start" style="background:${m.color}" onclick="startMission(${m.id})"><span>🚀</span><span>${completed?'Revisar':'Iniciar'}</span></button></div>`; }).join('')}
                    </div>
                </div>
                <div class="container section">
                    <div class="card">
                        <div class="progress-section"><span>Progreso General</span><span style="color:#fde047">${state.completedMissions.length}/5 Misiones</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${(state.completedMissions.length/5)*100}%"></div></div>
                        ${state.completedMissions.length===5?'<div style="text-align:center;margin-top:16px"><span style="font-size:24px">🎉🏆🎉</span><p style="color:#fde047;font-weight:bold;font-size:18px;margin-top:8px">¡Felicidades! ¡Has completado todas las misiones!</p></div>':''}
                    </div>
                </div>
                <footer class="footer"><p>© 2024 Institución Educativa Santa Rosa | Módulo de Comprensión Lectora</p><p class="small">Diseñado con ❤️ para fortalecer la lectura en español e inglés</p></footer>
            `;
        }

        function renderMissionPage() {
            const mission = missions[state.activeMission - 1];
            const data = state.missionData[state.activeMission] || { text: '', imageUrl: '', embedUrl: '', embedCode: '' };
            return `
                <div class="mission-page">
                    <div class="mission-nav">
                        <div class="mission-nav-content">
                            <button class="btn-back" onclick="backToMap()"><span>←</span><span>Volver al Mapa</span></button>
                            <div class="mission-info"><span class="icon">${mission.icon}</span><div><p class="label">Misión ${mission.id}</p><p class="title">${mission.title}</p></div></div>
                            <div class="nav-actions">
                                <button class="btn-save" onclick="saveContent()"><span>💾</span><span>Guardar</span></button>
                                <button class="btn-complete" onclick="completeMission()"><span>✅</span><span>Completar</span></button>
                            </div>
                        </div>
                    </div>
                    <div class="tabs">
                        <button class="tab-btn ${state.activeTab==='content'?'active':'inactive'}" onclick="switchTab('content')"><span>📝</span> Contenido (Texto/Imagen)</button>
                        <button class="tab-btn ${state.activeTab==='interactive'?'active':'inactive'}" onclick="switchTab('interactive')"><span>💻</span> Contenido Interactivo</button>
                    </div>
                    <div class="content-area">
                        <div class="content-box">
                            ${state.activeTab==='content' ? renderContentTab(mission, data) : renderInteractiveTab(mission, data)}
                        </div>
                    </div>
                    <div class="bottom-bar">
                        <div class="bottom-bar-content">
                            <div class="mission-label"><span style="font-size:18px">${mission.icon}</span><span>Misión ${mission.id} de 5</span></div>
                            <div class="actions">
                                <button class="btn-back" onclick="backToMap()">← Mapa</button>
                                <button class="btn-save" onclick="saveContent()">💾 Guardar</button>
                                <button class="btn-complete" onclick="completeMission()">✅ Completar (+200 XP)</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderContentTab(mission, data) {
            return `
                <h3><span style="font-size:24px">📝</span> Espacio de Contenido - Misión ${mission.id}</h3>
                <p class="description">${mission.description}</p>
                <div class="content-grid">
                    <div>
                        <label class="form-label"><span>✏️</span> Área de Texto</label>
                        <textarea class="text-area" id="textContent" placeholder="Escribe aquí el contenido de la misión..." oninput="updateMissionData('text', this.value)">${data.text||''}</textarea>
                        <p style="font-size:12px;color:#9ca3af;margin-top:4px">${(data.text||'').length} caracteres</p>
                    </div>
                    <div>
                        <label class="form-label"><span>🖼️</span> Imagen de la Misión</label>
                        <div class="image-upload">
                            ${data.imageUrl ? `<div class="image-preview"><img src="${data.imageUrl}" alt="Preview"><button class="remove-btn" onclick="removeImage()">✕</button></div>` : `<div class="upload-icon">📷</div><p class="upload-text">Selecciona una imagen para la misión</p><button class="btn-upload" onclick="document.getElementById('fileInput').click()">Seleccionar Imagen</button><input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">`}
                        </div>
                        <div style="margin-top:8px">
                            <label style="font-size:12px;color:#6b7280">O pega una URL de imagen:</label>
                            <input type="text" class="url-input" style="margin-top:4px" placeholder="https://ejemplo.com/imagen.jpg" value="${data.imageUrl&&!data.imageUrl.startsWith('data:')?data.imageUrl:''}" oninput="updateMissionData('imageUrl', this.value)">
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInteractiveTab(mission, data) {
            return `
                <h3><span style="font-size:24px">💻</span> Contenido Interactivo - Misión ${mission.id}</h3>
                <p class="description">Incrusta contenido interactivo: videos de Edpuzzle, páginas web, actividades HTML o scripts.</p>
                <div class="embed-toggle">
                    <button class="${state.embedMode==='url'?'active':'inactive'}" onclick="setEmbedMode('url')">🌐 URL / Iframe</button>
                    <button class="${state.embedMode==='code'?'active':'inactive'}" onclick="setEmbedMode('code')">📋 Código HTML/Script</button>
                </div>
                <div class="content-grid">
                    <div>
                        ${state.embedMode==='url' ? `
                            <label class="form-label"><span>🔗</span> URL del Contenido</label>
                            <input type="url" class="url-input" placeholder="https://edpuzzle.com/media/... o cualquier URL" value="${data.embedUrl||''}" oninput="updateMissionData('embedUrl', this.value)">
                            <div class="hint-box blue"><p class="hint-title">💡 Sugerencias:</p><ul><li>Videos de Edpuzzle: copia la URL del video</li><li>Google Forms para actividades</li><li>Páginas web educativas</li><li>Presentaciones de Google Slides</li></ul></div>
                        ` : `
                            <label class="form-label"><span>📝</span> Código HTML / Script</label>
                            <textarea class="text-area" style="font-family:monospace;font-size:13px" placeholder='<iframe src="..." width="100%" height="400px"></iframe>' oninput="updateMissionData('embedCode', this.value)">${data.embedCode||''}</textarea>
                            <div class="hint-box green"><p class="hint-title">💡 Puedes incluir:</p><ul><li>Iframes de Edpuzzle</li><li>Código HTML personalizado</li><li>Widgets interactivos</li><li>Scripts embebidos</li></ul></div>
                        `}
                    </div>
                    <div>
                        <label class="form-label"><span>👁️</span> Vista Previa Interactiva</label>
                        <div class="preview-box">
                            ${state.embedMode==='url'&&data.embedUrl ? `<iframe src="${data.embedUrl}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>` : state.embedMode==='code'&&data.embedCode ? `<div style="width:100%;height:100%;overflow:auto;background:white">${data.embedCode}</div>` : `<div class="preview-placeholder"><div><p style="font-size:48px;margin-bottom:16px">📎</p><p style="font-size:16px">Ingresa una URL o código HTML para incrustar contenido</p><p style="font-size:13px;margin-top:8px;color:#6b7280">Ejemplo: Videos de Edpuzzle, páginas web, actividades interactivas</p></div></div>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function startMission(id) { state.activeMission = id; state.activeTab = 'content'; if(!state.missionData[id]) state.missionData[id]={text:'',imageUrl:'',embedUrl:'',embedCode:''}; render(); }
        function backToMap() { state.activeMission = null; render(); }
        function switchTab(tab) { state.activeTab = tab; render(); }
        function setEmbedMode(mode) { state.embedMode = mode; render(); }
        function updateMissionData(field, value) { if(!state.missionData[state.activeMission]) state.missionData[state.activeMission]={text:'',imageUrl:'',embedUrl:'',embedCode:''}; state.missionData[state.activeMission][field]=value; }
        function handleImageUpload(event) { const file=event.target.files[0]; if(file){const r=new FileReader();r.onloadend=(e)=>{updateMissionData('imageUrl',e.target.result);render();};r.readAsDataURL(file);} }
        function removeImage() { updateMissionData('imageUrl',''); render(); }
        function saveContent() { const msg=document.createElement('div');msg.className='save-message';msg.innerHTML='<span style="font-size:20px">💾</span><span>¡Contenido guardado exitosamente!</span>';document.body.appendChild(msg);setTimeout(()=>msg.remove(),2000); }
        function completeMission() { const id=state.activeMission; if(!state.completedMissions.includes(id)){state.completedMissions.push(id);state.totalXP+=200;} const modal=document.createElement('div');modal.className='success-modal';modal.innerHTML='<div class="success-box"><div class="trophy">🏆</div><h2>¡Misión Completada!</h2><p>+200 XP ganados</p><div class="success-stars"><span style="animation-delay:0s">⭐</span><span style="animation-delay:0.2s">🌟</span><span style="animation-delay:0.4s">⭐</span></div></div>';document.body.appendChild(modal);setTimeout(()=>{modal.remove();state.activeMission=null;render();},2500); }

        function openSettings() { state.settingsVerified=false; document.getElementById('settingsModal').style.display='flex'; renderSettingsBody(); }
        function closeSettings() { document.getElementById('settingsModal').style.display='none'; }
        function renderSettingsBody() {
            const body=document.getElementById('settingsBody');
            if(!state.settingsVerified) {
                body.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:24px">🔐</span><h3 style="margin:0">Verificación de Seguridad</h3></div><p class="description">Ingresa la clave de administrador para acceder a los ajustes.</p><label>Contraseña:</label><input type="password" id="passwordInput" placeholder="Ingresa la clave..." onkeypress="if(event.key==='Enter')verifyPassword()"><div id="errorMsg" style="display:none" class="error-msg"></div><button class="btn-verify" onclick="verifyPassword()" style="margin-top:12px">🔓 Verificar</button>`;
                setTimeout(()=>document.getElementById('passwordInput')?.focus(),100);
            } else {
                body.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="font-size:24px">✅</span><h3 style="margin:0">Acceso Concedido</h3></div><div class="settings-options"><button class="settings-btn logout" onclick="logout()"><span class="btn-icon">🚪</span><div class="btn-text"><p class="main" style="color:#b91c1c">Cerrar Sesión</p><p class="sub">Salir del módulo didáctico</p></div><span class="arrow" style="color:#f87171">→</span></button><button class="settings-btn back" onclick="closeSettings()"><span class="btn-icon">↩️</span><div class="btn-text"><p class="main" style="color:#374151">Volver</p><p class="sub">Regresar al módulo</p></div><span class="arrow">→</span></button></div><div style="margin-top:16px;padding:12px;background:#eef2ff;border-radius:8px;border:1px solid #c7d2fe;text-align:center"><p style="font-size:12px;color:#4338ca">🏫 I.E. Santa Rosa | Módulo de Comprensión Lectora</p></div>`;
            }
        }
        function verifyPassword() { const input=document.getElementById('passwordInput');const errorMsg=document.getElementById('errorMsg');if(input.value===CORRECT_PASSWORD){state.settingsVerified=true;renderSettingsBody();}else{errorMsg.style.display='block';errorMsg.textContent='❌ Contraseña incorrecta. Intente nuevamente.';input.value='';input.focus();} }
        function logout() { state.isAuthenticated=false;state.activeMission=null;state.completedMissions=[];state.totalXP=0;closeSettings();render(); }
        function login() { state.isAuthenticated=true;render(); }

        render();
    </script>
</body>
</html>
